<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布玩具 · 童芽 ToySprout</title>
<link rel="stylesheet" href="styles.css">
<style>
  .pub-wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 64px; }
  .pub-card { border-radius: var(--radius-xl); padding: var(--space-8); box-shadow: var(--shadow-sm); }
  .field { margin-bottom: var(--space-6); }
  .field > label { display: block; font-size: 14px; font-weight: 600; margin-bottom: var(--space-2); }
  .field .req { color: var(--color-accent-strong); }
  .field input[type="text"], .field textarea {
    width: 100%; border-radius: var(--radius-md); border: 1px solid var(--color-border-strong);
    background: var(--color-surface); font-size: 15px; color: var(--color-text-primary);
    padding: 10px 12px; box-sizing: border-box; font-family: var(--font-sans);
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--focus-ring); }
  .field textarea { min-height: 84px; resize: vertical; }
  .opt-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .opt-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-full);
    border: 1px solid var(--color-border-strong); background: var(--color-surface); cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--color-text-secondary); user-select: none;
  }
  .opt-chip:hover { border-color: var(--color-primary-strong); }
  .opt-chip.selected { border-color: var(--color-primary); background: var(--color-primary-tint); color: var(--color-primary-ink); }
  .img-row { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); align-items: center; }
  .img-row input { flex: 1; }
  .img-row .btn { flex-shrink: 0; }
  .img-count { font-size: 13px; color: var(--color-text-tertiary); }
  .check-row { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; font-size: 14px; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--color-warning); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sprout" viewBox="0 0 24 24"><path d="M12 21V12"/><path d="M12 15c-3-1.6-5.4-4.6-5.8-8C10 7 13 8.8 14 12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15c3-1.6 5.4-4.6 5.8-8C14 7 11 8.8 10 12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="4.5" y="8" width="15" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M5.5 12h13v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 8v12.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 8c-2.5 0-4.2-1-4.2-2.7C7.8 3.6 9.6 2.8 12 4.4 14.4 2.8 16.2 3.6 16.2 5.3 16.2 7 14.5 8 12 8z" fill="none" stroke="currentColor" stroke-width="1.75"/></symbol>
    <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M8.5 12.2l2.3 2.3 4.7-4.9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wrinkle" viewBox="0 0 24 24"><path d="M5 8c3.5 0 3.5 2 7 2s3.5-2 7-2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><path d="M5 16c3.5 0 3.5-2 7-2s3.5 2 7 2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.2L21 19.5H3z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 10v4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><path d="M12 16.8h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M20 20l-4.6-4.6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.2-5.6-6.2-10.3a6.2 6.2 0 1 1 12.4 0C18.2 15.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="10.4" r="2.3" fill="none" stroke="currentColor" stroke-width="1.75"/></symbol>
  </defs>
</svg>

<!-- 顶部导航 -->
<header class="top-nav">
  <div class="container">
    <div class="top-nav__inner">
      <a class="brand" href="index.html" aria-label="童芽 ToySprout 首页">
        <span class="brand-mark"><svg class="ic"><use href="#i-sprout"/></svg></span>
        <span>童芽 <em>ToySprout</em></span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="explore.html">发现玩具</a>
        <a href="publish.html" class="is-active">发布玩具</a>
        <a href="orders.html">交换订单</a>
        <a href="profile.html">我的</a>
      </nav>
      <div class="nav-actions">
        <a class="btn btn--primary btn--sm" href="register.html">登录/注册</a>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="pub-wrap">
    <h1 class="h1" style="margin-bottom:4px;">发布玩具</h1>
    <p class="page-head__sub" style="margin:0 0 var(--space-6);">实拍 ≥3 张 · 如实选成色 · 填安全信息 —— 让闲置玩具去下一家发光</p>

    <form class="card pub-card" id="publish-form">
      <div class="field">
        <label for="title">玩具名称 <span class="req">*</span></label>
        <input id="title" type="text" maxlength="40" placeholder="如：乐高得宝大颗粒积木 120 粒">
      </div>

      <div class="field">
        <label>品类 <span class="req">*</span></label>
        <div class="opt-row" id="category-row">
          <span class="opt-chip" data-value="building_blocks">积木拼搭</span>
          <span class="opt-chip" data-value="outdoor_sports">运动户外</span>
          <span class="opt-chip" data-value="pretend_play">过家家</span>
          <span class="opt-chip" data-value="early_education">早教益智</span>
          <span class="opt-chip" data-value="plush_fabric">布艺毛绒</span>
        </div>
      </div>

      <div class="field">
        <label for="ageRange">适龄范围 <span class="req">*</span> <span class="img-count">（如 1.5-5 / 3-8）</span></label>
        <input id="ageRange" type="text" maxlength="10" placeholder="如：3-6">
      </div>

      <div class="field">
        <label>成色 <span class="req">*</span>（如实标注，标错将影响信用分）</label>
        <div class="opt-row" id="condition-row">
          <span class="opt-chip" data-value="new"><svg class="ic"><use href="#i-gift"/></svg>全新</span>
          <span class="opt-chip" data-value="9new"><svg class="ic"><use href="#i-circle-check"/></svg>9成新</span>
          <span class="opt-chip" data-value="8new"><svg class="ic"><use href="#i-clock"/></svg>8成新</span>
          <span class="opt-chip" data-value="used"><svg class="ic"><use href="#i-wrinkle"/></svg>有使用痕迹</span>
        </div>
        <p class="caption text-tertiary" id="condition-desc" style="margin:var(--space-2) 0 0;">未拆封/仅试玩 · 轻微使用无明显瑕疵 · 正常使用痕迹 · 明显磨损/小瑕疵</p>
      </div>

      <div class="field">
        <label for="description">描述 <span class="img-count">（配件情况、瑕疵位置请如实说明）</span></label>
        <textarea id="description" maxlength="500" placeholder="如：原装收纳盒，配件齐全；轮子有一个轻微划痕，不影响使用…"></textarea>
      </div>

      <div class="field">
        <label>实拍图片（URL）<span class="req">*</span> <span class="img-count">至少 3 张：整体、细节、瑕疵特写</span></label>
        <div id="img-list">
          <div class="img-row">
            <input type="text" class="img-input" placeholder="https://… 第 1 张（整体图）">
          </div>
          <div class="img-row">
            <input type="text" class="img-input" placeholder="https://… 第 2 张（细节图）">
          </div>
          <div class="img-row">
            <input type="text" class="img-input" placeholder="https://… 第 3 张（瑕疵特写）">
          </div>
        </div>
        <button type="button" class="btn btn--secondary btn--sm" id="add-img-btn"><svg class="ic"><use href="#i-plus"/></svg>添加图片</button>
      </div>

      <div class="field">
        <label class="check-row">
          <input type="checkbox" id="hasSmallParts">
          含小零件 · 3 岁以下慎玩（勾选后详情页展示警告标签）
        </label>
      </div>

      <div class="notice-bar" style="margin-bottom:var(--space-6);">
        <svg class="ic"><use href="#i-warn"/></svg>
        <span><strong>平台免责声明：</strong>请家长自行确认玩具安全性；成色与瑕疵以实拍照片为准，纠纷时将作为裁定依据。</span>
      </div>

      <button type="submit" class="btn btn--primary btn--lg" id="submit-btn" style="width:100%;">发布到交换池</button>
    </form>
  </div>
</main>

<script src="app.js"></script>
<script>
(function () {
  var T = window.ToySprout;
  T.requireAuth();
  T.renderNav();

  var selectedCategory = '';
  var selectedCondition = '';

  function bindChips(rowId, onPick) {
    var row = document.getElementById(rowId);
    row.querySelectorAll('.opt-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        row.querySelectorAll('.opt-chip').forEach(function (c) { c.classList.remove('selected'); });
        chip.classList.add('selected');
        onPick(chip.getAttribute('data-value'));
      });
    });
  }
  bindChips('category-row', function (v) { selectedCategory = v; });
  bindChips('condition-row', function (v) { selectedCondition = v; });

  document.getElementById('add-img-btn').addEventListener('click', function () {
    var list = document.getElementById('img-list');
    var div = document.createElement('div');
    div.className = 'img-row';
    div.innerHTML = '<input type="text" class="img-input" placeholder="https://… 第 ' + (list.children.length + 1) + ' 张">' +
      '<button type="button" class="btn btn--ghost btn--sm">移除</button>';
    div.querySelector('button').addEventListener('click', function () { div.remove(); });
    list.appendChild(div);
  });

  document.getElementById('publish-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = document.getElementById('title').value.trim();
    var ageRange = document.getElementById('ageRange').value.trim();
    var description = document.getElementById('description').value.trim();
    var images = Array.prototype.map.call(document.querySelectorAll('.img-input'), function (i) { return i.value.trim(); })
      .filter(function (v) { return !!v; });
    if (!title) return T.toast('请填写玩具名称', 'error');
    if (!selectedCategory) return T.toast('请选择品类', 'error');
    if (!ageRange) return T.toast('请填写适龄范围', 'error');
    if (!selectedCondition) return T.toast('请选择成色等级', 'error');
    if (images.length < 3) return T.toast('请至少填写 3 张图片 URL（整体、细节、瑕疵特写）', 'error');

    var btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '发布中…';
    T.post('/toys', {
      title: title,
      description: description,
      category: selectedCategory,
      ageRange: ageRange,
      conditionLevel: selectedCondition,
      hasSmallParts: document.getElementById('hasSmallParts').checked,
      images: images
    }).then(function (body) {
      if (body.code === 0) {
        T.toast('发布成功，玩具已进入交换池', 'success');
        setTimeout(function () { location.href = 'explore.html'; }, 800);
      } else {
        T.toast(body.message, 'error');
        btn.disabled = false; btn.textContent = '发布到交换池';
      }
    });
  });
})();
</script>
</body>
</html>
