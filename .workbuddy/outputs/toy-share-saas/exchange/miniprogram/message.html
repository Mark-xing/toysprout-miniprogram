<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息 · 童芽 ToySprout 小程序</title>
<!-- 设计系统：WarmTrust v2（phase2-design-tokens-v2.md §11 Quick Snippet）｜ C2C 一换一互邮交换 -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
<div class="page">

  <!-- ===== 状态栏 + 导航栏 + 胶囊 ===== -->
  <div class="nav-zone">
    <div class="status-bar">
      <span class="sb-time">9:41</span>
      <span class="sb-icons" aria-hidden="true">
        <svg class="sb-signal" viewBox="0 0 18 12"><rect x="0.5" y="7" width="3" height="5" rx="1" fill="currentColor"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="currentColor"/><rect x="9.5" y="2.2" width="3" height="9.8" rx="1" fill="currentColor"/><rect x="14" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".35"/></svg>
        <svg class="sb-wifi" viewBox="0 0 16 12"><path d="M1.5 4.5a10 10 0 0113 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 7a6.4 6.4 0 018 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M6.5 9.5a2.6 2.6 0 013 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.4" r="1" fill="currentColor"/></svg>
        <svg class="sb-batt" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor"/><path d="M23 4v4a2 2 0 000-4z" fill="currentColor"/></svg>
      </span>
    </div>
    <nav class="nav-bar" aria-label="页面导航">
      <span class="nav-title">消息</span>
    </nav>
    <button class="capsule" type="button" aria-label="更多">
      <span class="cap-dots" aria-hidden="true">···</span>
      <span class="cap-div" aria-hidden="true"></span>
      <svg class="cap-orb" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/></svg>
    </button>
  </div>

  <!-- ===== 页面主体 ===== -->
  <main class="page-main">

    <!-- 会话列表（头像 + 认证角标 + 信用 S 徽章 + 摘要 + 时间 + 交换意向标识） -->
    <ul class="conv-list" role="list">

      <!-- 会话 1：乐乐爸（交换意向 · 优选 985） -->
      <li class="conv-item" role="listitem">
        <a class="conv-link" href="chat.html">
          <span class="conv-avatar-wrap">
            <span class="avatar avatar--success conv-avatar">乐</span>
            <span class="avatar-verify"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
          </span>
          <span class="conv-main">
            <span class="conv-top">
              <span class="conv-name">乐乐爸</span>
              <span class="credit-badge credit-badge--s credit-badge--elite"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M12 7l1.4 3 3.2.4-2.3 2.3.6 3.2L12 14.8l-2.9 1.5.6-3.2-2.3-2.3 3.2-.4z"/></svg>优选 985</span>
              <span class="conv-time">10:24</span>
            </span>
            <span class="conv-msg">
              <span class="conv-flag"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 20V8"/><path d="M3.5 11l3-3 3 3"/><path d="M17.5 4v12"/><path d="M14.5 13l3 3 3-3"/></svg>交换意向</span>
              <span class="cm-text">可以交换吗？我这边有布鲁可恐龙套装</span>
            </span>
          </span>
        </a>
      </li>

      <!-- 会话 2：安安妈妈（交换意向 · 信赖 820） -->
      <li class="conv-item" role="listitem">
        <a class="conv-link" href="chat.html">
          <span class="conv-avatar-wrap">
            <span class="avatar avatar--info conv-avatar">安</span>
            <span class="avatar-verify"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
          </span>
          <span class="conv-main">
            <span class="conv-top">
              <span class="conv-name">安安妈妈</span>
              <span class="credit-badge credit-badge--s credit-badge--trusted"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>信赖 820</span>
              <span class="conv-time">昨天</span>
            </span>
            <span class="conv-msg">
              <span class="conv-flag"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 20V8"/><path d="M3.5 11l3-3 3 3"/><path d="M17.5 4v12"/><path d="M14.5 13l3 3 3-3"/></svg>交换意向</span>
              <span class="cm-text">磁力片还在吗？想用几何拼图跟你换</span>
            </span>
          </span>
        </a>
      </li>

      <!-- 会话 3：糖糖爸爸（新芽 580） -->
      <li class="conv-item" role="listitem">
        <a class="conv-link" href="chat.html">
          <span class="conv-avatar-wrap">
            <span class="avatar avatar--neutral conv-avatar">糖</span>
          </span>
          <span class="conv-main">
            <span class="conv-top">
              <span class="conv-name">糖糖爸爸</span>
              <span class="credit-badge credit-badge--s credit-badge--sprout"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16.5V8"/><path d="M12 9.2c-2.2 1-3.4 2.8-3.5 5 1.4-.4 2.4-1.2 3.1-2.3.7 1.1 1.7 1.9 3.1 2.3-.1-2.2-1.3-4-3.5-5z"/></svg>新芽 580</span>
              <span class="conv-time">昨天</span>
            </span>
            <span class="conv-msg"><span class="cm-text">在吗？运费怎么算呀</span></span>
          </span>
        </a>
      </li>

      <!-- 会话 4：童芽官方（订单提醒 · 状态机入口） -->
      <li class="conv-item" role="listitem">
        <a class="conv-link" href="order-detail.html">
          <span class="conv-avatar-wrap">
            <span class="avatar avatar--primary conv-avatar">芽</span>
          </span>
          <span class="conv-main">
            <span class="conv-top">
              <span class="conv-name">童芽官方客服</span>
              <span class="conv-time">周一</span>
            </span>
            <span class="conv-msg">
              <span class="conv-flag conv-flag--order"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>订单提醒</span>
              <span class="cm-text">您有一笔交换订单已进入「双方邮寄中」</span>
            </span>
          </span>
        </a>
      </li>

    </ul>

  </main>

  <!-- ===== 底部 TabBar（消息 激活） ===== -->
  <nav class="tab-bar" aria-label="底部导航">
    <a class="tab-item" href="discover.html">
      <svg class="ic tab-ic tab-ic--off" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
      <svg class="ic tab-ic tab-ic--on" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="currentColor" stroke="none"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="#FFF" stroke="none"/></svg>
      <span class="tab-label">发现</span>
    </a>
    <a class="tab-item tab-item--active" href="message.html" aria-current="page">
      <svg class="ic tab-ic tab-ic--off" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8.3 8.3 0 01-12 7.3L4 21l1.7-5A8.3 8.3 0 1121 12z"/></svg>
      <svg class="ic tab-ic tab-ic--on" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8.3 8.3 0 01-12 7.3L4 21l1.7-5A8.3 8.3 0 1121 12z" fill="currentColor" stroke="none"/></svg>
      <span class="tab-label">消息</span>
      <span class="tab-dot" aria-label="3 条未读" aria-hidden="true"></span>
    </a>
    <a class="tab-item tab-item--publish" href="publish.html">
      <span class="tab-pub"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="tab-label">发布</span>
    </a>
    <a class="tab-item" href="profile.html">
      <svg class="ic tab-ic tab-ic--off" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M5 20c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/></svg>
      <svg class="ic tab-ic tab-ic--on" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="currentColor" stroke="none"/><path d="M5 20.5c1.2-3.6 3.9-5.5 7-5.5s5.8 1.9 7 5.5z" fill="currentColor" stroke="none"/></svg>
      <span class="tab-label">我的</span>
    </a>
  </nav>

</div>
</div>
</body>
</html>
