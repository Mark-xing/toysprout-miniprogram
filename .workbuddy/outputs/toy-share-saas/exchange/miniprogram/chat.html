<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>与乐乐爸聊天 · 童芽 ToySprout 小程序</title>
<!-- 设计系统：WarmTrust v2（phase2-design-tokens-v2.md §11 Quick Snippet）｜ C2C 一换一互邮交换 -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
<div class="page">

  <!-- ===== 状态栏 + 导航栏（对方头像 + 信用小徽章）+ 胶囊 ===== -->
  <div class="nav-zone">
    <div class="status-bar">
      <span class="sb-time">9:41</span>
      <span class="sb-icons" aria-hidden="true">
        <svg class="sb-signal" viewBox="0 0 18 12"><rect x="0.5" y="7" width="3" height="5" rx="1" fill="currentColor"/><rect x="5" y="4.5" width="3" height="7.5" rx="1" fill="currentColor"/><rect x="9.5" y="2.2" width="3" height="9.8" rx="1" fill="currentColor"/><rect x="14" y="0" width="3" height="12" rx="1" fill="currentColor" opacity=".35"/></svg>
        <svg class="sb-wifi" viewBox="0 0 16 12"><path d="M1.5 4.5a10 10 0 0113 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4 7a6.4 6.4 0 018 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M6.5 9.5a2.6 2.6 0 013 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.4" r="1" fill="currentColor"/></svg>
        <svg class="sb-batt" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor"/><path d="M23 4v4a2 2 0 000-4z" fill="currentColor"/></svg>
      </span>
    </div>
    <nav class="nav-bar" aria-label="页面导航">
      <a class="nav-back" href="message.html" aria-label="返回上一页">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <span class="nav-title">
        <span class="avatar avatar--success nav-avatar">乐</span>
        乐乐爸
        <span class="credit-badge credit-badge--s credit-badge--elite"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M12 7l1.4 3 3.2.4-2.3 2.3.6 3.2L12 14.8l-2.9 1.5.6-3.2-2.3-2.3 3.2-.4z"/></svg>优选 985</span>
      </span>
      <button class="nav-right" type="button" aria-label="更多">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>
      </button>
    </nav>
    <button class="capsule" type="button" aria-label="更多">
      <span class="cap-dots" aria-hidden="true">···</span>
      <span class="cap-div" aria-hidden="true"></span>
      <svg class="cap-orb" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/></svg>
    </button>
  </div>

  <!-- ===== 对话界面 ===== -->
  <main class="page-main">

    <div class="chat-list">

      <span class="msg-system">今天 10:12</span>

      <div class="msg">
        <span class="avatar avatar--success msg-avatar">乐</span>
        <div class="msg-bubble">你好呀，看到你想换布鲁可恐龙套装？</div>
      </div>

      <div class="msg msg--me">
        <span class="avatar avatar--primary msg-avatar">雨</span>
        <div class="msg-bubble">对！我家娃最近迷恐龙，正好我这边有费雪小钢琴</div>
      </div>

      <div class="msg">
        <span class="avatar avatar--success msg-avatar">乐</span>
        <div class="msg-bubble">可以换吗？我这边运费自理</div>
      </div>

      <!-- 交换意向卡（玩具摘要 + 服务费保障 + 同意/拒绝） -->
      <div class="msg" style="max-width:92%;">
        <span class="avatar avatar--success msg-avatar">乐</span>
        <div class="intent-card">
          <span class="intent-tag"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 20V8"/><path d="M3.5 11l3-3 3 3"/><path d="M17.5 4v12"/><path d="M14.5 13l3 3 3-3"/></svg>交换意向</span>
          <div class="intent-row">
            <div class="intent-toy">
              <span class="intent-thumb">
                <svg viewBox="0 0 200 200" role="img" aria-label="布鲁可恐龙套装"><rect width="200" height="200" fill="#F3EADB"/><path d="M52 130l22-42 18 8 14-26 20 10 16-12 12 18 20 14-6 30z" fill="#3E7C59"/><rect x="66" y="130" width="12" height="24" rx="5" fill="#2F5D46"/></svg>
              </span>
              <div style="min-width:0;">
                <div class="intent-name">布鲁可恐龙套装</div>
                <div class="intent-owner"><span class="cond-badge cond-badge--s cond-badge--9new"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></svg>9成新</span></div>
              </div>
            </div>
            <span class="intent-swap"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 20V8"/><path d="M3.5 11l3-3 3 3"/><path d="M17.5 4v12"/><path d="M14.5 13l3 3 3-3"/></svg></span>
            <div class="intent-toy">
              <span class="intent-thumb">
                <svg viewBox="0 0 200 200" role="img" aria-label="费雪小钢琴"><rect width="200" height="200" fill="#FCE8E0"/><rect x="46" y="96" width="108" height="52" rx="10" fill="#C94324"/><rect x="56" y="88" width="88" height="12" rx="6" fill="#F27355"/><g fill="#FFF"><rect x="58" y="104" width="9" height="26" rx="2"/><rect x="70" y="104" width="9" height="26" rx="2"/><rect x="82" y="104" width="9" height="26" rx="2"/><rect x="94" y="104" width="9" height="26" rx="2"/><rect x="106" y="104" width="9" height="26" rx="2"/><rect x="118" y="104" width="9" height="26" rx="2"/><rect x="130" y="104" width="9" height="26" rx="2"/></g></svg>
              </span>
              <div style="min-width:0;">
                <div class="intent-name">费雪小钢琴</div>
                <div class="intent-owner"><span class="cond-badge cond-badge--s cond-badge--9new"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></svg>9成新</span></div>
              </div>
            </div>
          </div>
          <div class="intent-guarantee">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
            服务费 <span class="fee">¥1.9</span>（会员免）· 双方发起快递时收取 · 平台担保
          </div>
          <div class="intent-actions">
            <a class="btn btn--primary" href="order-detail.html">同意交换</a>
            <button class="btn btn--secondary" type="button" onclick="toast('已拒绝本次交换意向')">拒绝</button>
          </div>
        </div>
      </div>

      <div class="msg msg--me">
        <span class="avatar avatar--primary msg-avatar">雨</span>
        <div class="msg-bubble">可以！我这边也自理运费，今天下午就寄出</div>
      </div>

      <span class="msg-system">已达成交换意向 · 请尽快确认并开始互寄</span>

    </div>

  </main>

  <!-- ===== 底部输入（快捷语 + 输入框） ===== -->
  <div class="chat-footer">
    <div class="quick-row" role="group" aria-label="快捷语">
      <button class="quick-chip" type="button" onclick="fillQuick(this)">可以交换吗</button>
      <button class="quick-chip" type="button" onclick="fillQuick(this)">运费怎么算</button>
      <button class="quick-chip" type="button" onclick="fillQuick(this)">我今天寄出</button>
      <button class="quick-chip" type="button" onclick="fillQuick(this)">收到啦</button>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chat-input" type="text" placeholder="输入消息…" aria-label="输入消息">
      <button class="chat-send" type="button" aria-label="发送" onclick="toast('已发送')">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-7-6 14-2.5-5.5z"/><path d="M11.5 13.5L20 5"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    function toast(msg) {
      var t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('toast--show');
      clearTimeout(t._h);
      t._h = setTimeout(function () { t.classList.remove('toast--show'); }, 1800);
    }
    function fillQuick(el) {
      var input = document.getElementById('chat-input');
      input.value = el.textContent;
      input.focus();
    }
  </script>

</div>
</div>
</body>
</html>
