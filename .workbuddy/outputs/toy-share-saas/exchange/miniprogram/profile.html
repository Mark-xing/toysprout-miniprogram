<!DOCTYPE html>
<html lang="zh-CN">

      <div class="credit-top">
        <span class="credit-level">

        </div>

      <div class="credit-bar">
        <div class="progress" role="progressbar" aria-valuenow="862" aria-valuemin="500" aria-valuemax="1000" aria-label="信用分进度">

        </div>
        <div class="credit-scale"><span>500 新芽</span><span>600 成长</span><span>800 信赖</span><span>950 优选</span></div>
